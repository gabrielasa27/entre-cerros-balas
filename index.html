<style>
/* Formato de la presentación «Entre Cerros y Balas»: tarjetas crema con borde marrón,
   títulos bordó en Noto Serif, filete dorado, franjas bordó, recuadro blanco en títulos destacados. */
:root{
  --tierra:#251B16;      /* fondo oscuro, contador */
  --crema:#FFF7DE;       /* tarjeta principal */
  --crema-2:#FDF0CE;     /* tarjetas internas */
  --blanco:#FFFFFF;      /* recuadro de título */
  --borde:rgba(74,36,28,.66);  /* 4A241C al 66 % */
  --bordo:#741410;       /* títulos y franjas */
  --oro:#C57836;         /* filetes */
  --tinta:#251B16;       /* texto principal */
  --tinta-2:#432A23;     /* texto secundario */
  --rojo:#FF0000;        /* pregunta final */
  --jr:#c0261b; --ja:#1f4f9a;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif;
  --sans:"Noto Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--tierra);color:var(--tinta);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
svg{display:block}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--tierra);touch-action:none}
.nogl #gl{display:none}
.nogl body{background:var(--tierra) url(assets/paisaje.jpg) 50% 30%/cover no-repeat}
.velo{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(37,27,22,.25) 0,rgba(37,27,22,0) 18%)}

/* recuadro blanco de título (láminas 3, 8 y 10) */
.recuadro{position:fixed;z-index:12;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);
  width:max-content;max-width:calc(100% - 32px);background:var(--blanco);border:1.25px solid var(--borde);border-radius:12px;
  padding:10px 18px;text-align:center;font:700 clamp(19px,5.6vw,28px)/1.2 var(--serif);color:var(--bordo);text-wrap:balance;
  box-shadow:0 10px 24px -14px rgba(37,27,22,.6)}
.recuadro.entra{animation:caer .7s var(--ease) both}
@keyframes caer{from{opacity:0;transform:translate(-50%,-18px) rotateX(30deg)}to{opacity:1;transform:translate(-50%,0)}}

/* marcador de los jinetes */
.marca{position:fixed;z-index:4;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .5s;opacity:0}
.marca.on{opacity:1}
.par{display:flex;gap:3px;padding:5px 6px;border-radius:999px;background:var(--crema);border:1.25px solid var(--borde);animation:pulso 1.8s ease-out infinite}
.par i{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;transition:transform .3s,box-shadow .3s}
.par i.r{background:var(--jr)} .par i.a{background:var(--ja)}
.marca[data-foco="rojo"] .par i.r,.marca[data-foco="azul"] .par i.a{transform:scale(1.45);box-shadow:0 0 10px 2px rgba(255,247,222,.9)}
.marca__txt{font:700 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--crema);text-shadow:0 0 3px var(--tierra),0 0 6px var(--tierra)}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(197,120,54,.6)}100%{box-shadow:0 0 0 16px rgba(197,120,54,0)}}

/* tarjeta principal (como las de las láminas) */
.panel{position:fixed;z-index:20;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:50vh;height:50svh;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;
  background:rgba(255,247,222,.97);border:1.5px solid var(--borde);box-shadow:0 24px 50px -20px rgba(37,27,22,.75);perspective:900px}
.segs{padding:12px 16px 0;display:flex;gap:4px}
.segs button{height:4px;flex:1;border-radius:999px;background:rgba(116,20,16,.16);transition:background .3s}
.segs button.on{background:var(--bordo)}
.panel__body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 18px 16px;-webkit-overflow-scrolling:touch}
.cap{display:flex;flex-direction:column;gap:12px;transform-origin:50% 0}
.cap.entra{animation:entra .7s var(--ease) both}
@keyframes entra{from{opacity:0;transform:translateY(22px) rotateX(-14deg)}to{opacity:1;transform:none}}
.cap h1,.cap h2{margin:0;font:800 clamp(26px,7.4vw,34px)/1.12 var(--serif);color:var(--bordo);text-wrap:balance}
.filete{height:2px;border:0;margin:2px 0 0;background:var(--oro);transform-origin:left;animation:linea .8s var(--ease) .25s both}
@keyframes linea{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.destacado{margin:0;font:700 clamp(17px,4.8vw,20px)/1.3 var(--sans);color:var(--bordo)}
.destacado.tinta{color:var(--tinta)}
.cap p.txt{margin:0;font-size:clamp(15px,4.3vw,17px);line-height:1.5;color:var(--tinta)}
.vinetas{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:clamp(15px,4.3vw,17px);line-height:1.4;color:var(--tinta)}
.vinetas li{display:flex;gap:10px}
.vinetas li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--bordo);margin-top:.5em}
.tarjeta{background:var(--crema-2);border:1.25px solid var(--borde);border-radius:10px;padding:14px}
.tarjeta h3{margin:0;font:700 clamp(18px,5vw,21px)/1.2 var(--serif);color:var(--bordo)}
.tarjeta .filete{margin:8px 0 10px}
.tarjeta p{margin:0;font-size:15px;line-height:1.5;color:var(--tinta)}
.tarjeta p+p{margin-top:8px}
.franja{align-self:flex-start;background:var(--bordo);color:#fff;font:700 12px/1.25 var(--sans);letter-spacing:.07em;text-transform:uppercase;padding:9px 14px;border-radius:7px}
.pregunta{margin:0;font:700 clamp(22px,6.4vw,28px)/1.2 var(--serif);color:var(--rojo);text-align:center}
.portada{display:block;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1.25px solid var(--borde);margin:0}
.portada img{width:100%;height:100%;object-fit:cover;display:block}
.contacto{background:var(--bordo);color:#fff;border-radius:10px;padding:14px;display:grid;gap:8px;text-align:center}
.contacto b{font-weight:600;font-size:16px}
.contacto a{color:#fff;text-decoration:none;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:36px;word-break:break-all}
.contacto a:hover{text-decoration:underline}
.panel__nav{padding:10px 12px;border-top:1px solid rgba(74,36,28,.22);display:flex;align-items:center;gap:8px}
.btn{display:flex;align-items:center;gap:4px;padding:10px 14px;border-radius:8px;font:700 13px/1 var(--sans);min-height:42px}
.btn--sec{border:1.25px solid var(--borde);color:var(--tinta-2)}
.btn--sec:disabled{opacity:.35;cursor:default}
.btn--pri{background:var(--bordo);color:#fff;padding-inline:16px}
.btn--pri:hover{background:#8d1a14}
.contador{margin-left:auto;margin-right:auto;background:var(--tierra);color:#fff;font:700 12.5px/1 var(--sans);padding:8px 12px;border-radius:6px;font-variant-numeric:tabular-nums}

/* portada */
.intro{position:fixed;z-index:30;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:16px;perspective:1000px;
  padding:24px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(37,27,22,0) 35%,rgba(37,27,22,.85) 80%);transition:opacity .7s var(--ease),visibility .7s}
.intro.fuera{opacity:0;visibility:hidden}
.afiche{width:100%;max-width:560px;aspect-ratio:1672/941;border-radius:12px;overflow:hidden;border:3px solid var(--crema);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7);transform:rotateX(8deg) rotateY(var(--ry,-6deg));transition:transform .4s var(--ease);animation:afiche 1.1s var(--ease) both}
.afiche img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes afiche{from{opacity:0;transform:translateY(40px) rotateX(28deg)}}
.intro .btn--pri{font-size:15px;padding:15px 24px;min-height:50px;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
.intro small{color:var(--crema);font-size:13px;opacity:.9}

@media (min-width:768px){
  .panel{left:auto;right:24px;top:calc(env(safe-area-inset-top,0px) + 24px);bottom:24px;height:auto;width:420px}
  .recuadro{left:calc((100% - 444px)/2)}
  .intro{justify-content:center;background:radial-gradient(ellipse at 50% 55%,rgba(37,27,22,.2),rgba(37,27,22,.8))}
}
@media (prefers-reduced-motion:reduce){.cap.entra,.par,.recuadro.entra,.filete,.afiche{animation:none}.intro{transition:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<script>
(function(){
"use strict";
var root=document.documentElement;
var reducir=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- Capítulos (textos de la presentación) ----------------
   cam: u,v = punto del paisaje a mostrar (0..1, v desde arriba), z = alto visible (0..1)
   spot: jinete destacado, tinte: calidez, sombra: oscurecimiento (amenaza) */
var ROJO=[.472,.80], AZUL=[.535,.80];
var C=[
 {id:"portada",h1:"Entre Cerros y Balas",destacado:"Aventura histórica en realidad virtual",tono:"tinta",portada:true,credito:"César Ochoa · Laboratorio XR",
  cam:{u:.50,v:.62,z:.96},tinte:.04},
 {id:"contexto",h:"Jujuy, 1817",filete:true,txt:["Las tropas realistas avanzan sobre el norte argentino. Las milicias gauchas resisten y defienden el territorio."],franja:"Contexto histórico",
  cam:{u:.24,v:.55,z:.92}},
 {id:"protagonistas",recuadro:"Protagonistas de la historia",tarjetas:[
   {t:"Manuel Eduardo Arias",l:["Comandante de las milicias gauchas en Jujuy.","El 1 de marzo de 1817 encabezó la toma del cuartel realista de Humahuaca."]},
   {t:"Martín Miguel de Güemes",l:["Referente de la defensa del norte.","La comunicación entre las fuerzas patriotas resulta central para la misión ficticia del videojuego."]}],
  cam:{u:.50,v:.66,z:.80},tinte:.06},
 {id:"mision",h:"La misión",destacado:"Un mensaje debe llegar a Güemes.",
  txt:["Dos gauchos mensajeros vinculados con las tropas de Arias atraviesan la Quebrada de Humahuaca.","En el camino, una emboscada realista amenaza con detenerlos."],franja:"Aventura ficticia inspirada en 1817",
  cam:{u:.60,v:.66,z:.70},tinte:.22,sombra:.14,jinetes:true},
 {id:"jugadores",h:"Dos jugadores. Dos caballos.",destacado:"Un mismo objetivo: atravesar el recorrido y cumplir la misión.",tono:"tinta",
  tarjetas:[{l:["Cada jugador monta su propio caballo. Sus habilidades son diferentes y complementarias."]}],
  cam:{u:.505,v:.84,z:.60},tinte:.08,jinetes:true},
 {id:"jugador-1",h:"Jugador 1 · El recorrido",vinetas:["Mantiene el ritmo del galope.","Esquiva piedras y otros obstáculos.","Recoge recursos para seguir avanzando."],franja:"Ritmo · Precisión · Recursos",
  cam:{u:ROJO[0],v:.85,z:.52},spot:ROJO,tinte:.10,jinetes:true,foco:"rojo"},
 {id:"jugador-2",h:"Jugador 2 · La defensa",vinetas:["Identifica amenazas a lo largo del camino.","Enfrenta los ataques de las tropas realistas.","Protege a su compañero."],franja:"Atención · Reflejos · Protección",
  cam:{u:AZUL[0],v:.85,z:.52},spot:AZUL,tinte:.04,sombra:.16,jinetes:true,foco:"azul"},
 {id:"estrategia",recuadro:"Estrategia, táctica y cooperación",tarjetas:[
   {t:"Estrategia",l:["Administrar los recursos y tomar decisiones para cumplir la misión."]},
   {t:"Táctica",l:["Aprovechar el terreno, esquivar obstáculos y responder a las amenazas."]},

  cam:{u:.78,v:.62,z:.88},tinte:.05},
 {id:"territorio",h:"El territorio también es parte del desafío",
  txt:["Los cerros y caminos de la Quebrada de Humahuaca inspiran el recorrido del videojuego."],filete2:true,
  txt2:["Las milicias gauchas aprovecharon el conocimiento del terreno, los ataques sorpresivos y la interrupción del abastecimiento enemigo."],franja:"Inspirado en hechos históricos",
  cam:{u:.70,v:.52,z:.60},tinte:.12},
 {id:"aventura",recuadro:"Una aventura para descubrir Jujuy",destacado:"La experiencia busca despertar interés por:",
  vinetas:["La historia de la independencia en Jujuy.","Manuel Eduardo Arias y Martín Miguel de Güemes.","El patrimonio y los paisajes de la Quebrada."],
  tarjetas:[{t:"En desarrollo",l:["Videojuego cooperativo de realidad virtual.","Herramienta de desarrollo: Unreal Engine.","Desarrollador: César Ochoa.","Laboratorio XR."]}],
  cam:{u:.28,v:.60,z:.90},tinte:.06},
 {id:"cierre",h:"Entre Cerros y Balas",centro:true,destacado:"La historia de Jujuy se convierte en una aventura.",tono:"tinta",pregunta:"¿Podrás entregar el mensaje?",contacto:true,
  cam:{u:.50,v:.66,z:.96},tinte:.26,jinetes:true}
];
var N=C.length;

/* ---------------- Panel ---------------- */
var panel=document.getElementById("panel"),cuerpo=document.getElementById("cuerpo"),num=document.getElementById("num");
var segs=document.getElementById("segs"),ant=document.getElementById("ant"),sig=document.getElementById("sig");
var intro=document.getElementById("intro");
for(var i=0;i<N;i++){(function(k){var b=document.createElement("button");b.tabIndex=-1;b.onclick=function(){ir(k)};segs.appendChild(b);})(i);}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function icono(id){var s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("class","ic");var u=document.createElementNS("http://www.w3.org/2000/svg","use");u.setAttribute("href","#"+id);s.appendChild(u);return s;}

function render(c,k){
  var d=el("div","cap"+(reducir?"":" entra"));
  if(c.h1||c.h){var h=el(c.h1?"h1":"h2",null,c.h1||c.h);if(c.centro)h.style.textAlign="center";d.appendChild(h);}
  if(c.filete) d.appendChild(el("hr","filete"));
  if(c.portada){var f=el("figure","portada");var im=new Image();im.src="assets/portada.jpg";im.alt="Portada de Entre Cerros y Balas";f.appendChild(im);d.appendChild(f);}
  if(c.destacado){var ds=el("p","destacado"+(c.tono==="tinta"?" tinta":""),c.destacado);if(c.centro)ds.style.textAlign="center";d.appendChild(ds);}
  (c.txt||[]).forEach(function(p){d.appendChild(el("p","txt",p));});
  if(c.filete2) d.appendChild(el("hr","filete"));
  (c.txt2||[]).forEach(function(p){d.appendChild(el("p","txt",p));});
  if(c.vinetas){var ul=el("ul","vinetas");c.vinetas.forEach(function(v){ul.appendChild(el("li",null,v));});d.appendChild(ul);}
  (c.tarjetas||[]).forEach(function(tj){var b=el("div","tarjeta");if(tj.t){b.appendChild(el("h3",null,tj.t));b.appendChild(el("hr","filete"));}tj.l.forEach(function(x){b.appendChild(el("p",null,x));});d.appendChild(b);});
  if(c.pregunta) d.appendChild(el("p","pregunta",c.pregunta));
  if(c.contacto){
    var ct=el("div","contacto");ct.appendChild(el("b",null,"Cesar Ochoa – Laboratorio XR"));
    var a1=el("a");a1.href="tel:+541126688042";a1.textContent="CEL: 1126688042";
    var a2=el("a");a2.href="mailto:cio.4422.ochoa@gmail.com";a2.textContent="Email: cio.4422.ochoa@gmail.com";
    ct.appendChild(a1);ct.appendChild(a2);d.appendChild(ct);
  }
  if(c.credito) d.appendChild(el("p","txt",c.credito));
  if(c.franja) d.appendChild(el("span","franja",c.franja));
  return d;
}

var idx=-1;
function ir(k,sinVuelo){
  k=Math.max(0,Math.min(N-1,k)); if(k===idx) return;
  idx=k; var c=C[k];
  cuerpo.replaceChildren(render(c,k)); cuerpo.scrollTop=0;
  var rc=document.getElementById("recuadro");
  if(c.recuadro){rc.textContent=c.recuadro;rc.hidden=false;rc.classList.remove("entra");void rc.offsetWidth;if(!reducir)rc.classList.add("entra");}else rc.hidden=true;
  num.textContent=(k+1)+"/"+N;
  [].forEach.call(segs.children,function(b,j){b.classList.toggle("on",j<=k);});
  ant.disabled=k===0;
  sig.replaceChildren(); if(k===N-1){sig.appendChild(document.createTextNode("Volver al inicio"));}else{sig.appendChild(document.createTextNode("Siguiente "));sig.appendChild(icono("i-der"));}
  var h="#historia-"+(k+1); if(location.hash!==h) history.replaceState(null,"",h);
  volar(c,sinVuelo);
  var p=C[k+1]; if(p&&p.portada){var im=new Image();im.src="assets/portada.jpg";}
}
function empezar(k){intro.classList.add("fuera");panel.hidden=false;ir(k||0);setTimeout(function(){sig.focus({preventScroll:true});},50);}
document.getElementById("comenzar").onclick=function(){empezar(0);};
ant.onclick=function(){ir(idx-1);};
sig.onclick=function(){ if(idx===N-1){ idx=-1; panel.hidden=true; document.getElementById("recuadro").hidden=true; intro.classList.remove("fuera"); history.replaceState(null,"",location.pathname+location.search); volar(C[0]); } else ir(idx+1); };
window.addEventListener("keydown",function(e){
  if(panel.hidden){ if(e.key==="Enter"||e.key==="ArrowRight") empezar(0); return; }
  if(e.key==="ArrowRight") ir(idx+1); else if(e.key==="ArrowLeft") ir(idx-1);
});
/* deslizar a los costados (panel o paisaje) */
var t0=null;
document.addEventListener("touchstart",function(e){var t=e.touches[0];t0={x:t.clientX,y:t.clientY};},{passive:true});
document.addEventListener("touchend",function(e){
  if(!t0||panel.hidden) return; var t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y; t0=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4) ir(idx+(dx<0?1:-1));
},{passive:true});
window.addEventListener("hashchange",function(){var m=/^#historia-(\d+)$/.exec(location.hash);if(m){if(panel.hidden)empezar(+m[1]-1);else ir(+m[1]-1);}});

/* ---------------- Cámara (vuelo entre capítulos) ---------------- */
function E(c){return {u:c.cam.u,v:c.cam.v,z:c.cam.z,sx:(c.spot||[.5,.8])[0],sy:(c.spot||[.5,.8])[1],sk:c.spot?1:0,w:c.tinte||0,k:c.sombra||0};}
var cam=E(C[0]),desde=E(C[0]),hacia=E(C[0]),tVuelo=0,dur=1,pico=0;
function volar(c,inmediato){
  desde=JSON.parse(JSON.stringify(cam)); hacia=E(c); tVuelo=performance.now();
  var dist=Math.hypot(hacia.u-desde.u,hacia.v-desde.v);
  dur=(reducir||inmediato)?1:1900+dist*2600; pico=Math.min(.22,dist*.55);   // como flyTo: se aleja y vuelve a acercarse
  var j=document.getElementById("m-jinetes"); j.classList.toggle("on",!!c.jinetes); j.dataset.foco=c.foco||"";
}
function suave(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function paso(now){
  var k=Math.min(1,(now-tVuelo)/dur),e=suave(k);
  for(var key in hacia) cam[key]=desde[key]+(hacia[key]-desde[key])*e;
  cam.z=Math.min(.97,cam.z+pico*Math.sin(Math.PI*k));
}

/* ---------------- WebGL: paisaje con profundidad ---------------- */
var cv=document.getElementById("gl"),gl=null;
try{gl=cv.getContext("webgl",{antialias:false,alpha:false})||cv.getContext("experimental-webgl");}catch(e){}
var jin=document.getElementById("m-jinetes");
var IA=1920/1080,W=0,H=0,dpr=1;
function encuadre(){
  /* zona libre de la pantalla (fuera del panel) donde se centra el punto de interés */
  var w=innerWidth,h=innerHeight,movil=w<768,abierto=!panel.hidden;
  var fx=.5,fy=.5;
  var hueco=0,izq=0;                       /* parte de la pantalla tapada por el panel */
  if(abierto&&movil){hueco=1-(panel.getBoundingClientRect().top-8)/h;fy=(1-hueco)/2;}
  if(!abierto&&movil){hueco=.5;fy=.25;}           /* portada: el título ocupa la parte de abajo */
  var der=0;
  if(abierto&&!movil){fx=((w-444)/2)/w;der=444/w;}
  /* z del capítulo = alto de la imagen que entra en la zona libre */
  var va=w/h,z=cam.z/(1-hueco),zx=z*va/IA,zmax=.97/(1-hueco);
  if(zx>.97){zx=.97;z=zx*IA/va;} if(z>zmax){z=zmax;zx=z*va/IA;}
  var cu=cam.u+(.5-fx)*zx, cv2=cam.v+(.5-fy)*z;
  /* el borde de la imagen puede quedar debajo del panel, nunca en la zona visible */
  cu=Math.min(1-zx/2-.01+zx*der,Math.max(zx/2+.01-zx*izq,cu)); cv2=Math.min(1-z/2-.01+z*hueco,Math.max(z/2+.01,cv2));
  return {cu:cu,cv:cv2,zx:zx,z:z};
}
function ubicarJinetes(f){
  var x=((.503-f.cu)/f.zx+.5)*innerWidth, y=((.735-f.cv)/f.z+.5)*innerHeight;
  jin.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) translate(-50%,-100%)";
}

var ptr={x:0,y:0},ptrT={x:0,y:0};
var afiche=document.getElementById("afiche");
window.addEventListener("pointermove",function(e){ptrT.x=e.clientX/innerWidth-.5;ptrT.y=e.clientY/innerHeight-.5;},{passive:true});
window.addEventListener("deviceorientation",function(e){if(e.gamma==null)return;ptrT.x=Math.max(-.5,Math.min(.5,e.gamma/40));ptrT.y=Math.max(-.5,Math.min(.5,(e.beta-45)/50));},{passive:true});

if(!gl){
  root.classList.add("nogl");
  (function loop(now){paso(now);ubicarJinetes(encuadre());requestAnimationFrame(loop);})(performance.now());
}else{
  var VS="attribute vec2 a;varying vec2 s;void main(){s=a*.5+.5;gl_Position=vec4(a,0.,1.);}";
  var FS=["precision mediump float;varying vec2 s;",
   "uniform sampler2D T,D;uniform vec2 C,S,O;uniform float F,W,K;uniform vec3 SP;",
   "void main(){vec2 b=C+(s-.5)*S;vec2 p=b;",
   " for(int i=0;i<4;i++){float d=texture2D(D,p).r;p=b-O*(d-F);}",
   " float fuera=max(max(smoothstep(0.,-.04,b.y),smoothstep(0.,-.04,b.x)),smoothstep(1.,1.04,b.x));",
   " p=clamp(p,vec2(.001),vec2(.999));vec3 c=texture2D(T,p).rgb;float d=texture2D(D,p).r;",
   " c=mix(c,c*vec3(1.10,.96,.82)+vec3(.04,0.,-.02),W);",
   " c*=1.-K*(.55+.45*(1.-d));",
   " vec2 q=(p-SP.xy)*vec2(1.78,1.);float g=exp(-dot(q,q)/.0016);",
   " c=mix(c,c*(.70+.6*g)+vec3(.10,.07,.02)*g,SP.z);",
   " vec2 v=s-.5;c*=1.-dot(v,v)*.6;c=mix(c,vec3(.145,.106,.086),fuera);gl_FragColor=vec4(c,1.);}"].join("\n");
  var PV=["attribute vec3 a;uniform float TM,F;uniform vec2 O,R;varying float al;",
   "void main(){float dp=a.z;vec2 v=vec2(.012+.02*dp,.004*sin(TM*.3+a.x*20.));",
   " vec2 p=fract(a.xy+v*TM*.25);p+=-O*(dp-F)*2.6;p.y+=.02*sin(TM*.6+a.y*30.);",
   " gl_Position=vec4(p*2.-1.,0.,1.);gl_PointSize=(1.2+dp*3.6)*R.y/700.;al=(.16+.40*dp)*(.6+.4*sin(TM*1.3+a.x*50.));}"].join("\n");
  var PF="precision mediump float;varying float al;void main(){vec2 c=gl_PointCoord-.5;float r=dot(c,c);if(r>.25)discard;gl_FragColor=vec4(1.,.93,.78,al*(1.-r*4.));}";
  function sh(t,src){var o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
  function pr(v,f){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);return p;}
  var P1=pr(VS,FS),P2=pr(PV,PF);
  var q=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,q);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var NP=reducir?0:90,pts=new Float32Array(NP*3);for(var n=0;n<NP;n++){pts[n*3]=Math.random();pts[n*3+1]=Math.random();pts[n*3+2]=Math.pow(Math.random(),1.6);}
  var pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,pts,gl.STATIC_DRAW);
  function U(p,n){return gl.getUniformLocation(p,n);}
  var u1={T:U(P1,"T"),D:U(P1,"D"),C:U(P1,"C"),S:U(P1,"S"),O:U(P1,"O"),F:U(P1,"F"),W:U(P1,"W"),K:U(P1,"K"),SP:U(P1,"SP")},u2={TM:U(P2,"TM"),F:U(P2,"F"),O:U(P2,"O"),R:U(P2,"R")};
  var listas=0;
  function tex(unit,src){var t=gl.createTexture(),im=new Image();im.onload=function(){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);
    [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(function(p){gl.texParameteri(gl.TEXTURE_2D,p,gl.LINEAR);});
    [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(function(p){gl.texParameteri(gl.TEXTURE_2D,p,gl.CLAMP_TO_EDGE);});listas++;};
    im.onerror=function(){root.classList.add("nogl");};im.src=src;}
  tex(0,"assets/paisaje.jpg");tex(1,"assets/profundidad.png");
  function resize(){dpr=Math.min(devicePixelRatio||1,2);W=Math.round(innerWidth*dpr);H=Math.round(innerHeight*dpr);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}}
  addEventListener("resize",resize);resize();
  var T0=performance.now();
  (function frame(now){
    var tm=(now-T0)/1000; paso(now);
    ptr.x+=(ptrT.x-ptr.x)*.05; ptr.y+=(ptrT.y-ptr.y)*.05; if(afiche&&!intro.classList.contains("fuera"))afiche.style.setProperty("--ry",(-6+ptr.x*14).toFixed(2)+"deg");
    var f=encuadre(); ubicarJinetes(f);
    if(listas>=2){
      var amp=reducir?0:1;
      var ox=(Math.sin(tm*.45)*.010+ptr.x*.024)*amp*f.zx, oy=(Math.cos(tm*.33)*.006-ptr.y*.012)*amp*f.z;
      var foco=.25+.6*Math.max(0,Math.min(1,(.97-cam.z)/.57));
      gl.viewport(0,0,W,H);gl.useProgram(P1);gl.bindBuffer(gl.ARRAY_BUFFER,q);
      var la=gl.getAttribLocation(P1,"a");gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
      gl.uniform1i(u1.T,0);gl.uniform1i(u1.D,1);gl.uniform2f(u1.C,f.cu,1-f.cv);gl.uniform2f(u1.S,f.zx,f.z);gl.uniform2f(u1.O,ox,oy);
      gl.uniform1f(u1.F,foco);gl.uniform1f(u1.W,cam.w);gl.uniform1f(u1.K,cam.k);gl.uniform3f(u1.SP,cam.sx,1-cam.sy,cam.sk);
      gl.disable(gl.BLEND);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.disableVertexAttribArray(la);
      if(NP){gl.useProgram(P2);gl.bindBuffer(gl.ARRAY_BUFFER,pb);var lb=gl.getAttribLocation(P2,"a");gl.enableVertexAttribArray(lb);gl.vertexAttribPointer(lb,3,gl.FLOAT,false,0,0);
        gl.uniform1f(u2.TM,tm);gl.uniform1f(u2.F,foco);gl.uniform2f(u2.O,ox/f.zx,oy/f.z);gl.uniform2f(u2.R,W,H);
        gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.drawArrays(gl.POINTS,0,NP);gl.disableVertexAttribArray(lb);}
    }
    requestAnimationFrame(frame);
  })(performance.now());
}

/* enlace directo: #historia-5 abre el capítulo 5 */
var m=/^#historia-(\d+)$/.exec(location.hash);
if(m) empezar(+m[1]-1); else volar(C[0],true);
})();
</script>
